name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  id-token: write   # OIDC federation to Azure — no stored secrets/credentials
  contents: read

env:
  RESOURCE_GROUP: rg-taskbrain
  NODE_VERSION: "22"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  infra:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      app-name: ${{ steps.deploy.outputs.app-name }}
      registry-name: ${{ steps.deploy.outputs.registry-name }}
      function-app-name: ${{ steps.deploy.outputs.function-app-name }}
      browser-app-name: ${{ steps.deploy.outputs.browser-app-name }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Compile Bicep
        run: az bicep build --file infra/main.bicep --stdout >/dev/null
      # Container Apps rejects a revision whose image tag is absent from the
      # registry, so this image must exist before the Bicep deploy references
      # it. On a first-ever deploy there is no registry yet; Bicep then creates
      # the app on its placeholder image and the deploy job swaps it.
      - name: Build browser image (when the registry already exists)
        run: |
          ACR=$(az acr list -g "$RESOURCE_GROUP" --query "[0].name" -o tsv 2>/dev/null || true)
          if [ -z "$ACR" ]; then
            echo "no registry yet — Bicep will use the placeholder image"
            exit 0
          fi
          az acr build \
            --registry "$ACR" \
            --image "taskbrain-browser:${GITHUB_SHA}" \
            --image "taskbrain-browser:latest" \
            --file services/browser/Dockerfile \
            services/browser
          echo "BROWSER_IMAGE=$ACR.azurecr.io/taskbrain-browser:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Deploy Bicep (infra + runtime settings + container registry)
        id: deploy
        env:
          # Required (from scripts/bootstrap.sh output)
          BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
          BOT_APP_PASSWORD: ${{ secrets.BOT_APP_PASSWORD }}
          ADMIN_APP_ID: ${{ secrets.ADMIN_APP_ID }}
          ADMIN_APP_SECRET: ${{ secrets.ADMIN_APP_SECRET }}
          ADMIN_AAD_OBJECT_ID: ${{ secrets.ADMIN_AAD_OBJECT_ID }}
          # Optional integrations — leave unset to disable
          SMARTSHEET_API_TOKEN: ${{ secrets.SMARTSHEET_API_TOKEN }}
          SPECTRUM_PROJECT_ID: ${{ secrets.SPECTRUM_PROJECT_ID }}
          SPECTRUM_PROJECT_SECRET: ${{ secrets.SPECTRUM_PROJECT_SECRET }}
          WEB_SEARCH_API_KEY: ${{ secrets.WEB_SEARCH_API_KEY }}
          EXECUTION_GRAPH_WRITES_ENABLED: ${{ vars.EXECUTION_GRAPH_WRITES_ENABLED || 'false' }}
          INTENT_GATEWAY_ENABLED: ${{ vars.INTENT_GATEWAY_ENABLED || 'true' }}
          INTENT_SHADOW_MODE: ${{ vars.INTENT_SHADOW_MODE || 'true' }}
          CLARIFICATION_ENFORCEMENT_ENABLED: ${{ vars.CLARIFICATION_ENFORCEMENT_ENABLED || 'false' }}
          UNIFIED_ACTION_POLICY_ENABLED: ${{ vars.UNIFIED_ACTION_POLICY_ENABLED || 'false' }}
        run: |
          test -n "$BOT_APP_ID" -a -n "$BOT_APP_PASSWORD" -a -n "$ADMIN_APP_ID" -a -n "$ADMIN_APP_SECRET" || { echo "missing required secrets (BOT_APP_ID, BOT_APP_PASSWORD, ADMIN_APP_ID, ADMIN_APP_SECRET) — run scripts/bootstrap.sh or scripts/setup-admin-sso.sh"; exit 1; }
          # Omitted on a first deploy so Bicep keeps its placeholder default.
          BROWSER_PARAM=""
          [ -n "${BROWSER_IMAGE:-}" ] && BROWSER_PARAM="browserImage=$BROWSER_IMAGE"
          OUTPUTS=$(az deployment group create \
            -g $RESOURCE_GROUP \
            -f infra/main.bicep \
            --mode Incremental \
            --query properties.outputs \
            -o json \
            -p appName=taskbrain \
               planSku=B1 \
               appLocation=centralus \
               containerImageTag="${GITHUB_SHA}" \
               cheapModelName=gpt-4.1-mini \
               cheapModelVersion=2025-04-14 \
               standardModelName=gpt-5-mini \
               standardModelVersion=2025-08-07 \
               botAppId="$BOT_APP_ID" \
               botAppPassword="$BOT_APP_PASSWORD" \
               adminAppId="$ADMIN_APP_ID" \
               adminAppSecret="$ADMIN_APP_SECRET" \
               adminAadObjectId="$ADMIN_AAD_OBJECT_ID" \
               smartsheetApiToken="$SMARTSHEET_API_TOKEN" \
               spectrumProjectId="$SPECTRUM_PROJECT_ID" \
               spectrumProjectSecret="$SPECTRUM_PROJECT_SECRET" \
               webSearchApiKey="$WEB_SEARCH_API_KEY" \
               executionGraphWritesEnabled="$EXECUTION_GRAPH_WRITES_ENABLED" \
               intentGatewayEnabled="$INTENT_GATEWAY_ENABLED" \
               intentShadowMode="$INTENT_SHADOW_MODE" \
               clarificationEnforcementEnabled="$CLARIFICATION_ENFORCEMENT_ENABLED" \
               unifiedActionPolicyEnabled="$UNIFIED_ACTION_POLICY_ENABLED" \
               $BROWSER_PARAM)
          echo "app-name=$(jq -r '.appName.value' <<< "$OUTPUTS")" >> "$GITHUB_OUTPUT"
          echo "registry-name=$(jq -r '.registryName.value' <<< "$OUTPUTS")" >> "$GITHUB_OUTPUT"
          echo "function-app-name=$(jq -r '.functionAppName.value' <<< "$OUTPUTS")" >> "$GITHUB_OUTPUT"
          echo "browser-app-name=$(jq -r '.browserAppName.value' <<< "$OUTPUTS")" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [validate, infra]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push immutable image in ACR
        run: |
          az acr build \
            --registry "${{ needs.infra.outputs.registry-name }}" \
            --image "taskbrain:${GITHUB_SHA}" \
            --image "taskbrain:latest" \
            --file Dockerfile \
            .
      # Normally a no-op: the infra job already built this image and Bicep
      # deployed it. This only does work after a first deploy, where the app
      # was created on the placeholder image.
      - name: Ensure the browser Container App runs this commit's image
        run: |
          TARGET="${{ needs.infra.outputs.registry-name }}.azurecr.io/taskbrain-browser:${GITHUB_SHA}"
          CURRENT=$(az containerapp show \
            -g "$RESOURCE_GROUP" \
            -n "${{ needs.infra.outputs.browser-app-name }}" \
            --query "properties.template.containers[0].image" -o tsv)
          if [ "$CURRENT" = "$TARGET" ]; then
            echo "browser app already on ${GITHUB_SHA}"
            exit 0
          fi
          az acr build \
            --registry "${{ needs.infra.outputs.registry-name }}" \
            --image "taskbrain-browser:${GITHUB_SHA}" \
            --image "taskbrain-browser:latest" \
            --file services/browser/Dockerfile \
            services/browser
          az containerapp update \
            -g "$RESOURCE_GROUP" \
            -n "${{ needs.infra.outputs.browser-app-name }}" \
            --image "$TARGET"
      - name: Restart App Service onto the new image
        run: az webapp restart -g "$RESOURCE_GROUP" -n "${{ needs.infra.outputs.app-name }}"
      - name: Smoke test (retries while App Service pulls the image)
        run: |
          for i in $(seq 1 30); do
            if curl --connect-timeout 5 --max-time 10 -sf \
              "https://${{ needs.infra.outputs.app-name }}.azurewebsites.net/healthz"; then
              echo
              echo "healthy on image ${GITHUB_SHA}"
              exit 0
            fi
            echo "waiting for container ($i/30)..."
            sleep 10
          done
          echo "app did not become healthy"; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Package and deploy meeting ingest Function
        run: |
          npm ci
          npm run build
          cp functions/meeting-ingest/host.json host.json
          python - <<'PY'
          import json
          json.dump({
            "name": "taskbrain-meeting-ingest",
            "version": "0.1.0",
            "main": "dist/meetings/timer.js",
            "engines": {"node": ">=22"}
          }, open("fn-package.json", "w"))
          PY
          mv fn-package.json package.json
          # config/ ships with the zip: src/config.ts resolves it from cwd, and
          # router.ts reads model.routes.json at import time.
          zip -r meeting-ingest.zip host.json package.json dist config node_modules -x "node_modules/.cache/*"
          az functionapp deployment source config-zip \
            -g "$RESOURCE_GROUP" \
            -n "${{ needs.infra.outputs.function-app-name }}" \
            --src meeting-ingest.zip

# Setup (one-time):
# 1. Entra app registration for CI with federated credential:
#    subject: repo:<org>/<repo>:environment:production
# 2. Grant it Contributor, RBAC Administrator, ACR Tasks Contributor, and
#    AcrPush on rg-taskbrain (bootstrap does this).
# 3. Repo secrets (bootstrap.sh prints them, or sets them with `gh` if installed):
#    required: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
#              BOT_APP_ID, BOT_APP_PASSWORD, ADMIN_APP_ID, ADMIN_APP_SECRET,
#              ADMIN_AAD_OBJECT_ID
#    optional: SMARTSHEET_API_TOKEN, SPECTRUM_PROJECT_ID, SPECTRUM_PROJECT_SECRET,
#              WEB_SEARCH_API_KEY (Tavily tvly- key by default; Brave or Bing if WEB_SEARCH_ENGINE is set)
# 4. Bicep creates a Basic ACR. The App Service system identity has AcrPull;
#    CI builds in ACR via OIDC and deploys immutable Git SHA image tags.
# 5. Resource providers are registered out of band by bootstrap.sh. CI only has
#    rights on the resource group, and `az provider register` is subscription
#    scope, so it cannot self-heal a missing provider.
